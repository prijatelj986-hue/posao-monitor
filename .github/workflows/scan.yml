name: Dnevna pretraga poslova

on:
  schedule:
    # 06:00 UTC = 08:00 po srednjeevropskom letnjem vremenu
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Podesi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instaliraj zavisnosti
        run: pip install -r requirements.txt

      - name: Pokreni pretragu i pošalji notifikacije
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Sačuvaj seen_jobs.json u repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          git diff --staged --quiet || git commit -m "Ažuriraj listu viđenih oglasa"
          git push
